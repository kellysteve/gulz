name: GULZ checks

on:
  push:
    branches: [main, coding-agent-refresh]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Run CLI tests and website typecheck
        run: npm test
      - name: Build all workspaces
        run: npm run build
