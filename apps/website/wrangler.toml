name = "gulz"
main = "src/worker.ts"
compatibility_date = "2026-11-02"
workers_dev = true
preview_urls = false
routes = [{ pattern = "gulz.gaxity.com.ng/*", zone_name = "gaxity.com.ng" }]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/install", "/install.sh"]

[vars]
APP_ENV = "production"
